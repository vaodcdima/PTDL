[server]
headless = false           # tự mở trình duyệt khi chạy web
showEmailPrompt = false    # không hỏi email lần đầu

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"    # ẩn bớt menu kỹ thuật của Streamlit

[theme]                    # luôn dùng giao diện sáng (khớp màu trong web/style.css)
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F0FDFA"
secondaryBackgroundColor = "#E3F6F2"
textColor = "#134E4A"
borderColor = "#C5EBE4"
showWidgetBorder = true
baseRadius = "12px"
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
